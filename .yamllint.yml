extends: default
rules:
  line-length:
    max: 120
    level: warning
  truthy:
    level: warning
    allowed-values: ['true', 'false']
  indentation:
    spaces: 2
    indent-sequences: whatever
    check-multi-line-strings: false
  braces:
    min-spaces-inside: 0
    max-spaces-inside: 1
  brackets:
    min-spaces-inside: 0
    max-spaces-inside: 1
  comments:
    min-spaces-from-content: 1
  document-start: disable